name: Push Zapier App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  push-zapier:
    name: Build, validate, and push to Zapier
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Zapier CLI
        run: npm install -g zapier-platform-cli@19.0.0

      - name: Run checks
        run: npm run check

      - name: Push to Zapier
        run: npm run push-zapier
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
